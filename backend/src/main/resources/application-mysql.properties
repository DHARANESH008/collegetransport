# =====================================================================
# SMART COLLEGE TRANSPORT MANAGEMENT SYSTEM - MYSQL PRODUCTION CONFIG
# Activate via: --spring.profiles.active=mysql
# =====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/college_transport?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 3-Month Database Auto-Cleanup Policy Configuration
app.cleanup.retention-days=90
app.cleanup.cron=0 0 0 * * ?
app.cleanup.enabled=true
