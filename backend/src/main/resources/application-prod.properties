# =====================================================================
# PRODUCTION CLOUD CONFIGURATION (Render / Railway / Cloud)
# =====================================================================

server.port=${PORT:8080}

# Database Configuration with Environment Variable Fallbacks (Default H2 embedded)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:transportt;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Retention Policy
app.cleanup.retention-minutes=3
app.cleanup.cron=0 */1 * * * ?
app.cleanup.enabled=true

# CORS
app.cors.allowed-origins=*
