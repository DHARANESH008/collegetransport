# =====================================================================
# SMART COLLEGE TRANSPORT MANAGEMENT SYSTEM - APPLICATION CONFIG
# =====================================================================

spring.application.name=Smart-College-Transport-Management-System
server.port=${PORT:8080}
server.servlet.context-path=/

# ---------------------------------------------------------------------
# Database Configuration (Universal H2 Embedded / MySQL Environment)
# ---------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:transportt;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# JWT Security Configuration
# ---------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------
# 90-Day (3 Months) Database Auto-Cleanup Policy Configuration
# ---------------------------------------------------------------------
# Retention period in days (90 days / 3 months)
app.cleanup.retention-days=90
# Scheduled cron (Runs every night at midnight: 0 0 0 * * ?)
app.cleanup.cron=0 0 0 * * ?
# Enable or disable auto cleanup
app.cleanup.enabled=true

# ---------------------------------------------------------------------
# CORS Configuration (Web & Mobile clients)
# ---------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://10.0.2.2:8080,*

# ---------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
