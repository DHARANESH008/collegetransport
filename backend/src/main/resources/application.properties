# =====================================================================
# SMART COLLEGE TRANSPORT MANAGEMENT SYSTEM - APPLICATION CONFIG
# =====================================================================

spring.application.name=Smart-College-Transport-Management-System
server.port=8080
server.servlet.context-path=/

# ---------------------------------------------------------------------
# MySQL Database Configuration (Permanent Storage: transportt)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/transportt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=732523IT008
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# JWT Security Configuration
# ---------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------
# 3-Minute Database Auto-Cleanup Policy Configuration
# ---------------------------------------------------------------------
# Retention period in minutes (3 minutes)
app.cleanup.retention-minutes=3
# Scheduled cron (Runs every 1 minute: 0 */1 * * * ?)
app.cleanup.cron=0 */1 * * * ?
# Enable or disable auto cleanup
app.cleanup.enabled=true

# ---------------------------------------------------------------------
# CORS Configuration (Web & Mobile clients)
# ---------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://10.0.2.2:8080,*

# ---------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
